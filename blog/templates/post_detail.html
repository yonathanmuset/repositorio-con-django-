{% extends "layout.html" %}
{% block content %}
<section class="blog post-detail">
    <div class="container-narrow">
        <article class="post-article">
            <a href="{% url 'blog:posts' %}" class="blog-read-more">Volver a publicaciones</a>
            <span class="section-label">Blog</span>
            <h1 class="section-title">{{ post.title }}</h1>
            <time class="post-date" datetime="{{ post.date|date:'Y-m-d' }}">{{ post.date|date:"d M Y" }}</time>
            <div class="post-content">{{ post.description|safe }}</div>
            {% if post.image %}
            <img src="{{ post.image.url }}" alt="{{ post.title }}" class="post-detail-image" loading="lazy">
            {% endif %}
        </article>
    </div>
</section>
{% endblock %}
